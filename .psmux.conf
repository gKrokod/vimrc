# ---------- Префикс ----------
# Ctrl+Space вместо стандартного Ctrl+b
unbind C-b
unbind C-a
set -g prefix C-Space
bind C-Space send-prefix

# ---------- Терминал и совместимость ----------
set -g default-terminal "xterm-256color"
set -g extended-keys on          # нужно Pi и другим CLI-агентам
set -g mouse on                  # мышь: панели и прокрутка
set -g allow-predictions on      # PSReadLine predictions внутри psmux
set -g paste-detection off       # Ctrl+V доходит до Neovim

# ---------- Нумерация ----------
set -g base-index 1              # окна начинаются с 1
setw -g pane-base-index 1        # панели начинаются с 1

# ---------- Быстрые сплиты ----------
# Ctrl+Space → v: слева/справа
bind v split-window -h
# Ctrl+Space → s: сверху/снизу
bind s split-window -v

# ---------- Vim-подобная навигация между панелями ----------
# Без префикса: Ctrl+hjkl
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Дополнительно: Alt+стрелки
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ---------- Переключение между окнами ----------
# После префикса Ctrl+Space: h/l — предыдущее/следующее окно
bind h previous-window
bind l next-window

# ---------- Режимы vi ----------
set -g status-keys vi
setw -g mode-keys vi

# ---------- История и прочее ----------
set -g history-limit 100000
set -g escape-time 0
set -g renumber-windows on
set -g detach-on-destroy off

# ---------- Статусная строка (минималистичная) ----------
# set -g status-style bg=#005f87,fg=#ffffff
set -g status-style bg=default,fg=#444444
# # set -g status-left ""               # слева ничего
# set -g status-right "#S | #H"       # справа: сессия | хост
set -g status-interval 5            # обновлять раз в 5 сек -g
# set -g status-position top

# Автопереименование окон: 
setw -g automatic-rename on
#
# Позиция и общие цвета (светлый фон в тон PaperColor)
set -g status-position top
# set -g status-style bg=#e4e4e4,fg=#444444

# Левая часть: Имя сессии в квадратных скобках
set -g status-left " #[fg=#005f87,bold][#S] "
set -g status-left-length 20

# Правая часть: Только дата и время (без лишней информации)
set -g status-right "#[fg=#444444] %Y-%m-%d │ %H:%M "
set -g status-right-length 50

# Центр: Список окон (вкладок)
# Неактивные окна (просто текст)
set -g window-status-format " #I:#W "
# Активное окно (выделено фирменным синим цветом PaperColor и жирным шрифтом)
set -g window-status-current-format "#[fg=#ffffff,bg=#005f87,bold] #I:#W "
# set -g window-status-current-format "#[fg=#005f87,bold] #I:#W "

# Выравнивание окон по центру (опционально, делает как в macOS/Windows)
set -g status-justify centre

